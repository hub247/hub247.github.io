<script>
const DATA = [{"title": "O que é o ChatGPT e como ele ajuda nos negócios", "short": "O que é o ChatGPT", "minutes": 14, "content": "\n<p>ChatGPT é um assistente de IA da OpenAI que ajuda profissionais a escrever, pesquisar, analisar, organizar ideias, criar materiais, revisar textos, gerar códigos e automatizar partes do trabalho. No contexto de negócios, o principal valor está em transformar uma demanda aberta em uma entrega mais clara, estruturada e útil.</p>\n<p>Para usar bem, trate o ChatGPT como um parceiro de produtividade: informe contexto, objetivo, público, formato esperado e critérios de qualidade. A resposta deve ser revisada antes de virar comunicação oficial, relatório, decisão ou conteúdo publicado.</p>\n<h4>Quando usar</h4><ul><li>Brainstorming de ideias, campanhas, nomes, pautas e abordagens.</li><li>Redação e revisão de e-mails, relatórios, propostas e apresentações.</li><li>Análise de dados, planilhas, tabelas e indicadores.</li><li>Pesquisa, síntese de fontes e estruturação de relatórios.</li></ul>\n<h4>Prompt base</h4><pre><code>Atue como um consultor de negócios. Meu contexto é: [explique o cenário]. Preciso de uma resposta para [objetivo]. Entregue em formato de [tabela/lista/relatório/e-mail], com recomendações, riscos e próximos passos.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema O que é o ChatGPT?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "ChatGPT, Copilot, Gemini e Claude: qual usar em cada situação", "short": "ChatGPT vs outras IAs", "minutes": 15, "content": "\n<p>ChatGPT é forte como ferramenta versátil para pensamento, escrita, análise, criatividade e automação. A escolha entre ChatGPT, Copilot, Gemini e Claude depende do ecossistema, da integração com dados, do nível de confidencialidade e do tipo de entrega.</p>\n<h4>Comparação prática</h4><ul><li><strong>ChatGPT:</strong> brainstorming, redação, análise, dados, imagens, GPTs, pesquisa e automação ampla.</li><li><strong>Copilot:</strong> produtividade dentro do Microsoft 365.</li><li><strong>Gemini:</strong> produtividade dentro do Google Workspace.</li><li><strong>Claude:</strong> escrita longa, documentos extensos, análise cuidadosa e projetos estruturados.</li></ul>\n<h4>Prompt base</h4><pre><code>Compare ChatGPT, Copilot, Gemini e Claude para a seguinte tarefa: [descreva]. Avalie por qualidade esperada, integração, velocidade, risco, revisão necessária e melhor cenário de uso.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema ChatGPT vs outras IAs?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Como conversar bem com o ChatGPT", "short": "Fundamentos de prompt", "minutes": 14, "content": "\n<p>Boas respostas começam com bons pedidos. Uma instrução objetiva evita respostas genéricas e aumenta a chance de obter algo pronto para adaptação.</p>\n<h4>Estrutura recomendada</h4><ul><li><strong>Contexto:</strong> área, problema e cenário.</li><li><strong>Objetivo:</strong> o que você quer decidir ou entregar.</li><li><strong>Público:</strong> diretoria, cliente, equipe, fornecedor ou público geral.</li><li><strong>Formato:</strong> tabela, e-mail, plano, roteiro, checklist ou apresentação.</li><li><strong>Critérios:</strong> tom, tamanho, profundidade, riscos e limitações.</li></ul>\n<h4>Prompt base</h4><pre><code>Contexto: [descreva]. Objetivo: [explique]. Público: [informe]. Formato final: [defina]. Critérios: seja claro, objetivo, sem jargões e destaque riscos e próximos passos.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Fundamentos de prompt?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Prompt Engineering para negócios no ChatGPT", "short": "Prompt avançado", "minutes": 17, "content": "\n<p>Prompt engineering é transformar uma solicitação vaga em um comando claro, reutilizável e orientado ao resultado. Em negócios, isso evita retrabalho e melhora consistência.</p>\n<h4>Técnicas úteis</h4><ul><li>Peça que o ChatGPT atue como uma função profissional.</li><li>Divida a resposta em diagnóstico, análise, recomendação e ação.</li><li>Peça perguntas antes da resposta quando o contexto estiver incompleto.</li><li>Solicite revisão crítica e contra-argumentos.</li><li>Crie templates de prompts para tarefas recorrentes.</li></ul>\n<h4>Prompt base</h4><pre><code>Atue como um revisor estratégico. Avalie minha ideia abaixo por clareza, impacto, riscos, lacunas de informação e versão melhorada para apresentação executiva.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Prompt avançado?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "ChatGPT Search e Deep Research", "short": "Pesquisa e Deep Research", "minutes": 18, "content": "\n<p>Search ajuda a buscar informações atuais de forma rápida. Deep Research é indicado quando a pergunta exige pesquisa de várias fontes, análise, síntese e relatório documentado. Para uso profissional, revise as fontes e valide as conclusões antes de tomar decisões.</p>\n<h4>Quando usar cada um</h4><ul><li><strong>Search:</strong> consultas rápidas sobre temas atuais, tendências, concorrentes ou notícias.</li><li><strong>Deep Research:</strong> relatórios mais completos, comparação de mercado, análise setorial e levantamento de fontes.</li><li><strong>Pesquisa com fontes internas:</strong> quando conectado a arquivos, apps ou bases autorizadas pela empresa.</li></ul>\n<h4>Prompt base</h4><pre><code>Faça uma pesquisa estruturada sobre [tema]. Priorize fontes confiáveis, separe fatos de interpretações, traga citações/verificações e entregue um resumo executivo com recomendações.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Pesquisa e Deep Research?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Custom GPTs: criando assistentes para tarefas recorrentes", "short": "Custom GPTs", "minutes": 16, "content": "\n<p>Custom GPTs são versões configuradas do ChatGPT para tarefas específicas. Eles podem manter instruções, conhecimento de referência e capacidades selecionadas, reduzindo a necessidade de repetir contexto a cada conversa.</p>\n<h4>Exemplos corporativos</h4><ul><li>Assistente de padronização de e-mails comerciais.</li><li>Assistente de análise de planilhas recorrentes.</li><li>Assistente de perguntas frequentes com arquivos de referência.</li><li>Assistente de revisão de apresentações para diretoria.</li></ul>\n<h4>Prompt base</h4><pre><code>Quero criar um Custom GPT para [processo]. Defina instruções, tom, limites, arquivos de conhecimento necessários, perguntas iniciais e critérios de qualidade da resposta.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Custom GPTs?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Canvas: escrita, revisão e código em um espaço colaborativo", "short": "Canvas", "minutes": 15, "content": "\n<p>Canvas é útil quando a tarefa exige edição, revisão e iteração em texto ou código. Em vez de trabalhar apenas por mensagens, ele permite revisar trechos, ajustar versões e evoluir uma entrega com mais controle.</p>\n<h4>Aplicações práticas</h4><ul><li>Rascunhar relatórios, propostas e comunicados.</li><li>Revisar tom, clareza, tamanho e estrutura de textos.</li><li>Trabalhar com código, comentários, bugs e melhorias.</li><li>Iterar versões de uma entrega até chegar ao padrão final.</li></ul>\n<h4>Prompt base</h4><pre><code>Use Canvas para criar uma primeira versão de [documento/código]. Estruture em seções, deixe espaço para comentários e sugira melhorias de clareza, tom e consistência.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Canvas?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Análise de dados, planilhas e visualizações com ChatGPT", "short": "Dados e planilhas", "minutes": 18, "content": "\n<p>ChatGPT pode apoiar análise de planilhas, tabelas, CSVs e indicadores, ajudando a encontrar padrões, explicar variações, criar gráficos e transformar dados em narrativa de negócios.</p>\n<h4>Cuidados importantes</h4><ul><li>Confirme se os dados foram lidos corretamente.</li><li>Valide totais, filtros, períodos e unidades.</li><li>Peça que o ChatGPT diferencie fatos, hipóteses e recomendações.</li><li>Revise gráficos e conclusões antes de apresentar.</li></ul>\n<h4>Prompt base</h4><pre><code>Analise estes dados como um analista de inteligência comercial. Identifique variações relevantes, possíveis causas, riscos de interpretação e recomendações para uma apresentação executiva.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Dados e planilhas?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", nte o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Segurança, privacidade e uso responsável do ChatGPT", "short": "Segurança e privacidade", "minutes": 17, "content": "\n<p>O uso profissional de ChatGPT precisa respeitar privacidade, confidencialidade, LGPD, políticas internas e revisão humana. Em planos empresariais, há compromissos específicos de privacidade e controles administrativos, mas o usuário continua responsável por usar dados de forma adequada.</p>\n<h4>Regras de ouro</h4><ul><li>Não inserir dados sensíveis sem autorização.</li><li>Não publicar respostas sem revisão.</li><li>Verificar fontes, números e premissas.</li><li>Registrar decisões nos sistemas oficiais da empresa.</li><li>Evitar usar IA para dados pessoais sem base adequada.</li></ul>\n<h4>Prompt base</h4><pre><code>Revise esta entrega sob a ótica de segurança, privacidade e LGPD. Aponte dados sensíveis, riscos, informações não verificadas e ajustes necessários antes de compartilhar.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Segurança e privacidade?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Projeto final: fluxo de produtividade com ChatGPT", "short": "Projeto final", "minutes": 20, "content": "\n<p>O projeto final consiste em montar um fluxo de trabalho real usando ChatGPT: entrada da demanda, análise, geração de primeira versão, revisão, validação e entrega final.</p>\n<h4>Passos</h4><ol><li>Escolha uma rotina recorrente.</li><li>Defina o resultado esperado.</li><li>Crie um prompt completo.</li><li>Peça análise crítica.</li><li>Valide dados e riscos.</li><li>Transforme a saída em entrega final.</li></ol>\n<h4>Prompt base</h4><pre><code>Ajude-me a criar um fluxo de trabalho com ChatGPT para [rotina]. Inclua etapas, prompts, critérios de revisão, riscos, validações e indicadores de produtividade.</code></pre>", "quiz": [{"q": "Qual é uma boa prática no tema Projeto final?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, fontes, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir precisão, fontes, riscos e governança."}, {"q": "Qual é o melhor papel do ChatGPT em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "ChatGPT deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}];
const KEY='chatgptCourseStateV1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"route":"intro","module":0,"passed":[],"graded":false,"lastScore":null}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function pct(){return Math.round((state.passed.length/DATA.length)*100);}
function unlocked(i){return i===0||state.passed.includes(i-1);}
function renderNav(){let nav=document.getElementById('nav');let html=`<div class="nav-item ${state.route==='intro'?'active':''}" onclick="intro()"><svg class="icon"><use href="#i-home"/></svg><span>Início</span></div>`;DATA.forEach((m,i)=>{let cls='nav-item '+(state.module===i&&state.route==='module'?'active ':'')+(state.passed.includes(i)?'done ':'')+(!unlocked(i)?'locked':'');html+=`<div class="${cls}" ${unlocked(i)?`onclick="go(${i})"`:''}><span class="num">${state.passed.includes(i)?'✓':i+1}</span><span>${m.short}</span></div>`});nav.innerHTML=html;document.getElementById('pct').textContent=pct()+'%';document.getElementById('bar').style.width=pct()+'%';document.getElementById('gprog').style.width=pct()+'%';}
function intro(){state.route='intro';state.graded=false;save();render();}
function go(i){if(!unlocked(i))return;state.route='module';state.module=i;state.graded=false;save();render();scrollTo(0,0);}
function renderIntro(){document.getElementById('crumb').innerHTML='';document.getElementById('content').innerHTML=`<section class="hero"><h2>ChatGPT para Negócios</h2><p>Aprenda a usar ChatGPT para brainstorming, redação, dados, pesquisa, Custom GPTs, Canvas, conectores, automações, segurança e produtividade corporativa.</p><div class="cta" onclick="go(0)"><svg class="icon"><use href="#i-arrow"/></svg>Começar o treinamento</div></section><div class="grid"><div class="card"><h3>Progresso sequencial</h3><p>Cada módulo é liberado conforme você conclui o anterior.</p></div><div class="card"><h3>Avaliação por módulo</h3><p>Responda ao quiz e alcance pelo menos 70% para avançar.</p></div><div class="card"><h3>Foco em negócios</h3><p>Exemplos e prompts práticos para trabalho real, sem conteúdo genérico.</p></div><div class="card"><h3>Uso responsável</h3><p>Privacidade, revisão humana, fontes, governança e cuidado com dados sensíveis.</p></div></div>`;}
function renderModule(){let m=DATA[state.module];document.getElementById('crumb').innerHTML=`Módulo ${state.module+1} › <b>${m.short}</b>`;document.getElementById('content').innerHTML=`<div class="panel"><h2>${m.title}</h2><p style="color:var(--muted)">${m.minutes} min de leitura · ${m.quiz.length} perguntas</p>${m.content}<div class="actions"><button class="btn" onclick="intro()">Voltar ao início do curso</button><button class="btn primary" onclick="quiz()">Ir para avaliação</button></div></div>`;}
function quiz(){let m=DATA[state.module];document.getElementById('crumb').innerHTML=`Módulo ${state.module+1} › <b>Avaliação</b>`;let html=`<div class="panel"><h2>Avaliação do módulo</h2><p style="color:var(--muted)">Aprovação mínima: 70%.</p>`;m.quiz.forEach((q,qi)=>{html+=`<div class="q"><h3>${qi+1}. ${q.q}</h3>`;q.options.forEach((o,oi)=>html+=`<label class="quiz-option" id="opt-${qi}-${oi}"><input type="radio" name="q${qi}" value="${oi}">${o}</label>`);html+=`<p id="exp-${qi}" style="display:none;color:var(--muted)"></p></div>`});html+=`<button class="btn primary" onclick="grade()">Enviar respostas</button><div id="result"></div></div>`;document.getElementById('content').innerHTML=html;}
function grade(){let m=DATA[state.module],right=0;m.quiz.forEach((q,i)=>{let picked=document.querySelector(`input[name=q${i}]:checked`);q.options.forEach((o,oi)=>{let el=document.getElementById(`opt-${i}-${oi}`);if(oi===q.correct)el.classList.add('correct');if(picked&&Number(picked.value)===oi&&oi!==q.correct)el.classList.add('wrong');});let exp=document.getElementById(`exp-${i}`);exp.style.display='block';exp.textContent=q.explanation;if(picked&&Number(picked.value)===q.correct)right++;});let score=Math.round(right/m.quiz.length*100);let pass=score>=70;if(pass&&!state.passed.includes(state.module))state.passed.push(state.module);save();renderNav();document.getElementById('result').innerHTML=`<div class="result ${pass?'pass':'fail'}">Resultado: ${score}% — ${pass?'Aprovado!':'Revise o módulo e tente novamente.'}</div><div class="actions"><button class="btn" onclick="go(${state.module})">Revisar conteúdo</button>${pass&&state.module<DATA.length-1?`<button class="btn primary" onclick="go(${state.module+1})">Próximo módulo</button>`:pass?`<button class="btn primary" onclick="intro()">Concluir curso</button>`:''}</div>`;}
function render(){renderNav();state.route==='module'?renderModule():renderIntro();}
document.getElementById('theme').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';};
render();
