<script>
const DATA = [{"title": "O que é o Claude e onde ele se encaixa nos negócios", "short": "O que é o Claude", "icon": "brain", "minutes": 14, "content": "\n<p>Claude é o assistente de IA da Anthropic, criado para apoiar tarefas de escrita, análise, raciocínio, programação, pesquisa e organização de conhecimento. Em negócios, a melhor forma de enxergar Claude é como um parceiro de trabalho para pensar, estruturar, revisar e transformar informação em entrega.</p>\n<p>O diferencial do Claude para uso corporativo está no foco em conversas longas, trabalho com documentos, análise cuidadosa, criação de conteúdo estruturado e colaboração em projetos complexos.</p>\n<h4>Quando usar Claude</h4>\n<ul><li>Para revisar textos longos, contratos, políticas, relatórios e propostas.</li><li>Para transformar materiais extensos em resumos executivos, planos de ação e apresentações.</li><li>Para criar rascunhos de documentos com linguagem clara e profissional.</li><li>Para apoiar análise crítica: riscos, premissas, inconsistências e alternativas.</li></ul>\n<h4>Prompt base</h4><pre><code>Atue como um consultor de negócios. Leia o contexto abaixo e entregue uma resposta em linguagem executiva, separando: resumo, principais riscos, oportunidades, pontos que precisam de validação e próximos passos.\n\nContexto: [cole aqui]</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema O que é o Claude?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Claude, ChatGPT, Copilot e Gemini: como escolher a ferramenta certa", "short": "Claude vs outras IAs", "icon": "scales", "minutes": 15, "content": "\n<p>Não existe uma única IA ideal para todas as tarefas. A escolha depende do ecossistema, do tipo de dado, da profundidade de análise necessária, da integração disponível e das políticas de segurança da empresa.</p>\n<p>Claude costuma ser uma boa opção quando a tarefa exige leitura cuidadosa, organização de conteúdo longo, escrita aprofundada, revisão crítica e construção de entregáveis bem estruturados.</p>\n<h4>Critério de escolha</h4><ul><li><strong>Claude:</strong> análise textual profunda, documentos longos, escrita, raciocínio e projetos.</li><li><strong>Copilot:</strong> produtividade integrada ao Microsoft 365.</li><li><strong>Gemini:</strong> produtividade integrada ao Google Workspace.</li><li><strong>ChatGPT:</strong> uso geral, brainstorming e automações variadas.</li></ul>\n<h4>Prompt base</h4><pre><code>Compare Claude, ChatGPT, Copilot e Gemini para a seguinte tarefa: [descreva a tarefa]. Avalie por: qualidade esperada, integração, risco, velocidade, revisão necessária e melhor cenário de uso.</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Claude vs outras IAs?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Como conversar bem com Claude", "short": "Fundamentos de prompt", "icon": "chat", "minutes": 14, "content": "\n<p>Conversar bem com Claude significa detalhar o problema com clareza. Em vez de pedir apenas “resuma isso”, explique o objetivo, o público, o nível de detalhe e o formato final esperado.</p>\n<h4>Método C.O.F.R.E.</h4><ul><li><strong>Contexto:</strong> área, problema, cenário e público.</li><li><strong>Objetivo:</strong> o resultado que você quer obter.</li><li><strong>Formato:</strong> tabela, lista, e-mail, roteiro, apresentação ou plano.</li><li><strong>Restrições:</strong> tom, tamanho, limites, dados permitidos.</li><li><strong>Exemplo:</strong> um modelo do padrão esperado.</li></ul>\n<h4>Prompt base</h4><pre><code>Contexto: [explique o cenário].\nObjetivo: [o que preciso decidir ou entregar].\nFormato: [tabela, e-mail, relatório, plano].\nRestrições: [tom, tamanho, dados, cuidados].\nExemplo de estilo: [cole referência, se houver].</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Fundamentos de prompt?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Prompt Engineering para negócios com Claude", "short": "Prompt avançado", "icon": "target", "minutes": 17, "content": "\n<p>Prompt engineering para negócios é a prática de transformar uma demanda vaga em uma instrução clara, auditável e reutilizável. Claude tende a responder melhor quando recebe papéis, critérios, exemplos e instruções de revisão.</p>\n<h4>Técnicas úteis</h4><ul><li>Peça que Claude atue como uma função específica: consultor, analista, revisor, facilitador ou especialista.</li><li>Peça respostas em camadas: primeiro resumo, depois análise, depois recomendação.</li><li>Solicite contrapontos: riscos, objeções, premissas frágeis e informações faltantes.</li><li>Peça versões alternativas para públicos diferentes.</li></ul>\n<h4>Prompt base</h4><pre><code>Atue como um revisor estratégico. Avalie minha proposta abaixo em quatro blocos: clareza, força dos argumentos, riscos não tratados e versão melhorada para diretoria.\n\nProposta: [cole aqui]</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Prompt avançado?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Claude Projects: organizando trabalho por tema, cliente ou processo", "short": "Projects", "icon": "folder", "minutes": 15, "content": "\n<p>Projects ajudam a organizar conversas, arquivos e contexto em torno de um objetivo. Para negócios, isso permite criar espaços de trabalho por cliente, área, campanha, relatório, treinamento ou processo recorrente.</p>\n<h4>Como aplicar</h4><ul><li>Crie um projeto para um tema específico, como “Relatórios Comerciais”, “Treinamento Interno” ou “Análise de Mercado”.</li><li>Adicione instruções de estilo e critérios de qualidade.</li><li>Mantenha documentos de referência, padrões de escrita e modelos de entrega.</li><li>Use o projeto para padronizar respostas e reduzir retrabalho.</li></ul>\n<h4>Prompt base</h4><pre><code>Dentro deste projeto, siga sempre estas regras: escreva em linguagem executiva, destaque riscos, não invente dados, peça validação quando faltar informação e entregue respostas em formato prático para decisão.</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Projects?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Claude Artifacts: criando documentos, protótipos e materiais reutilizáveis", "short": "Artifacts", "icon": "artifact", "minutes": 16, "content": "\n<p>Artifacts são úteis quando a entrega precisa ficar separada da conversa principal e ser reutilizada, editada ou compartilhada como um conteúdo independente.</p>\n<h4>Exemplos de uso</h4><ul><li>Documentos em Markdown ou texto simples.</li><li>Páginas HTML de treinamento, dashboards simples ou protótipos.</li><li>Diagramas, fluxos e componentes visuais.</li><li>Templates de política, planejamento, checklists e roteiros.</li></ul>\n<h4>Prompt base</h4><pre><code>Crie um artifact em HTML com uma página executiva sobre [tema]. Use layout limpo, cards, seções bem definidas, linguagem profissional e um resumo no topo com as principais conclusões.</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Artifacts?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Claude para escrita profissional e revisão executiva", "short": "Escrita e revisão", "icon": "edit", "minutes": 14, "content": "\n<p>Claude é especialmente útil para transformar textos brutos em comunicações claras. Pode apoiar e-mails, memorandos, políticas, apresentações, propostas, comunicados e relatórios.</p>\n<h4>Aplicações práticas</h4><ul><li>Reescrever texto técnico para linguagem de diretoria.</li><li>Reduzir textos longos sem perder a decisão principal.</li><li>Corrigir tom, clareza, coerência e estrutura.</li><li>Criar versões para diferentes públicos.</li></ul>\n<h4>Prompt base</h4><pre><code>Reescreva o texto abaixo para uma audiência executiva. Mantenha o significado, reduza jargões, destaque a decisão necessária e finalize com próximos passos claros.\n\nTexto: [cole aqui]</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Escrita e revisão?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": nálise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Claude para análise de dados e raciocínio crítico", "short": "Dados e análise", "icon": "chart", "minutes": 16, "content": "\n<p>Claude pode ajudar a interpretar dados, levantar hipóteses e organizar conclusões. O papel do usuário é validar números, confirmar fontes e separar fatos de inferências.</p>\n<h4>Aplicações</h4><ul><li>Interpretar tendências descritas em tabelas ou relatórios.</li><li>Criar perguntas para investigação.</li><li>Identificar riscos de leitura errada dos dados.</li><li>Transformar análise em narrativa executiva.</li></ul>\n<h4>Prompt base</h4><pre><code>Com base nos dados abaixo, identifique padrões, possíveis causas, riscos de interpretação e perguntas que devo responder antes de apresentar para a liderança.\n\nDados: [cole aqui]</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Dados e análise?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Claude Code e automação para equipes técnicas e analíticas", "short": "Claude Code", "icon": "code", "minutes": 15, "content": "\n<p>Claude Code é voltado para trabalhar com código, investigação técnica, depuração, explicação de repositórios, testes e apoio a fluxos de desenvolvimento. Em negócios, esse tema é relevante para times de BI, tecnologia, dados e automação.</p>\n<h4>Possíveis usos</h4><ul><li>Explicar scripts, consultas e automações.</li><li>Apoiar criação de páginas HTML, dashboards e componentes técnicos.</li><li>Investigar erros e sugerir correções.</li><li>Documentar processos técnicos para usuários de negócio.</li></ul>\n<h4>Prompt base</h4><pre><code>Explique este código para uma pessoa de negócios. Depois liste riscos, dependências, pontos de manutenção e uma versão resumida para documentação interna.\n\nCódigo: [cole aqui]</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Claude Code?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Segurança, privacidade e governança no uso do Claude", "short": "Segurança e governança", "icon": "shield", "minutes": 17, "content": "\n<p>O uso corporativo de IA exige governança. Mesmo quando uma ferramenta oferece recursos empresariais, o usuário deve seguir políticas internas, proteger informações sensíveis e validar respostas.</p>\n<h4>Regras de ouro</h4><ul><li>Não inserir dados confidenciais sem autorização.</li><li>Não aceitar respostas como verdade final sem revisão.</li><li>Registrar decisões importantes fora da ferramenta, nos sistemas oficiais da empresa.</li><li>Definir padrões de uso por área, tipo de dado e risco da tarefa.</li></ul>\n<h4>Prompt base</h4><pre><code>Revise esta entrega sob a ótica de segurança e governança. Aponte dados sensíveis, riscos de exposição, informações que precisam de validação e ajustes antes de compartilhar.</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Segurança e governança?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dado confidencial", "Evitar critérios de qualidade"], "correct": 1, "explanation": "O uso profissional exige contexto, formato claro e revisão humana."}, {"q": "O que deve ser validado antes de compartilhar uma resposta gerada por IA?", "options": ["Apenas o visual", "Dados, nomes, prazos, premissas e aderência às políticas internas", "Nada, se a resposta parecer boa", "Somente a ortografia"], "correct": 1, "explanation": "A revisão deve cobrir conteúdo, precisão, riscos e governança."}, {"q": "Qual é o melhor papel do Claude em decisões corporativas?", "options": ["Substituir totalmente o responsável pela decisão", "Apoiar análise, estruturação e primeira versão da entrega", "Tomar decisões sem contexto", "Eliminar todas as validações"], "correct": 1, "explanation": "Claude deve apoiar o trabalho, mas a decisão final permanece humana."}, {"q": "O que torna um prompt mais forte?", "options": ["Ser genérico", "Informar objetivo, público, formato, restrições e exemplo", "Pedir resposta muito curta sempre", "Não explicar o cenário"], "correct": 1, "explanation": "Prompts estruturados aumentam consistência e qualidade."}]}, {"title": "Projeto final: criar um fluxo de trabalho com Claude", "short": "Projeto final", "icon": "award", "minutes": 20, "content": "\n<p>O projeto final transforma o aprendizado em prática. Escolha uma rotina real do trabalho e desenhe um fluxo usando Claude, desde a entrada da demanda até a entrega final revisada.</p>\n<h4>Estrutura sugerida</h4><ol><li>Escolha uma tarefa recorrente.</li><li>Defina o resultado esperado.</li><li>Crie o prompt inicial.</li><li>Peça revisão crítica.</li><li>Valide dados e riscos.</li><li>Transforme a saída em entrega final.</li></ol>\n<h4>Prompt base</h4><pre><code>Ajude-me a transformar esta rotina em um fluxo de trabalho com Claude. Crie etapas, prompts, critérios de revisão, riscos e indicadores de ganho de produtividade.\n\nRotina: [descreva]</code></pre>\n", "quiz": [{"q": "Qual é uma boa prática no tema Projeto final?", "options": ["Usar respostas sem revisão", "Dar contexto, pedir formato e validar a saída", "Inserir qualquer dad const KEY='claudeCourseStateV1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"route":"intro","module":0,"passed":[],"graded":false,"lastScore":null}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function pct(){return Math.round((state.passed.length/DATA.length)*100);}
function unlocked(i){return i===0||state.passed.includes(i-1);}
function renderNav(){
 let nav=document.getElementById('nav');let html=`<div class="nav-item ${state.route==='intro'?'active':''}" onclick="intro()"><svg class="icon"><use href="#i-home"/></svg><span>Início</span></div>`;
 DATA.forEach((m,i)=>{let cls='nav-item '+(state.module===i&&state.route==='module'?'active ':'')+(state.passed.includes(i)?'done ':'')+(!unlocked(i)?'locked':'');html+=`<div class="${cls}" ${unlocked(i)?`onclick="go(${i})"`:''}><span class="num">${state.passed.includes(i)?'✓':i+1}</span><span>${m.short}</span></div>`});
 nav.innerHTML=html;document.getElementById('pct').textContent=pct()+'%';document.getElementById('bar').style.width=pct()+'%';document.getElementById('gprog').style.width=pct()+'%';
}
function intro(){state.route='intro';state.graded=false;save();render();}
function go(i){if(!unlocked(i))return;state.route='module';state.module=i;state.graded=false;save();render();scrollTo(0,0);}
function renderIntro(){document.getElementById('crumb').innerHTML='';document.getElementById('content').innerHTML=`<section class="hero"><h2>Claude para Negócios</h2><p>Aprenda a usar Claude em tarefas corporativas: escrita, análise de documentos, Projects, Artifacts, raciocínio crítico, Claude Code, governança e prompts prontos para produtividade.</p><div class="cta" onclick="go(0)"><svg class="icon"><use href="#i-arrow"/></svg>Começar o treinamento</div></section><div class="grid"><div class="card"><h3>Progresso sequencial</h3><p>Cada módulo é liberado conforme você conclui o anterior.</p></div><div class="card"><h3>Avaliação por módulo</h3><p>Responda ao quiz e alcance pelo menos 70% para avançar.</p></div><div class="card"><h3>Foco em negócios</h3><p>Exemplos e prompts práticos para trabalho real, sem linguagem técnica desnecessária.</p></div><div class="card"><h3>Uso responsável</h3><p>Privacidade, revisão humana, governança e cuidado com dados sensíveis.</p></div></div>`;}
function renderModule(){let m=DATA[state.module];document.getElementById('crumb').innerHTML=`Módulo ${state.module+1} › <b>${m.short}</b>`;document.getElementById('content').innerHTML=`<div class="panel"><h2>${m.title}</h2><p style="color:var(--muted)">${m.minutes} min de leitura · ${m.quiz.length} perguntas</p>${m.content}<div class="actions"><button class="btn" onclick="intro()">Voltar ao início do curso</button><button class="btn primary" onclick="quiz()">Ir para avaliação</button></div></div>`;}
function quiz(){let m=DATA[state.module];document.getElementById('crumb').innerHTML=`Módulo ${state.module+1} › <b>Avaliação</b>`;let html=`<div class="panel"><h2>Avaliação do módulo</h2><p style="color:var(--muted)">Aprovação mínima: 70%.</p>`;m.quiz.forEach((q,qi)=>{html+=`<div class="q"><h3>${qi+1}. ${q.q}</h3>`;q.options.forEach((o,oi)=>html+=`<label class="quiz-option" id="opt-${qi}-${oi}"><input type="radio" name="q${qi}" value="${oi}">${o}</label>`);html+=`<p id="exp-${qi}" style="display:none;color:var(--muted)"></p></div>`});html+=`<button class="btn primary" onclick="grade()">Enviar respostas</button><div id="result"></div></div>`;document.getElementById('content').innerHTML=html;}
function grade(){let m=DATA[state.module],right=0;m.quiz.forEach((q,i)=>{let picked=document.querySelector(`input[name=q${i}]:checked`);q.options.forEach((o,oi)=>{let el=document.getElementById(`opt-${i}-${oi}`);if(oi===q.correct)el.classList.add('correct');if(picked&&Number(picked.value)===oi&&oi!==q.correct)el.classList.add('wrong');});let exp=document.getElementById(`exp-${i}`);exp.style.display='block';exp.textContent=q.explanation;if(picked&&Number(picked.value)===q.correct)right++;});let score=Math.round(right/m.quiz.length*100);let pass=score>=70;if(pass&&!state.passed.includes(state.module))state.passed.push(state.module);save();renderNav();document.getElementById('result').innerHTML=`<div class="result ${pass?'pass':'fail'}">Resultado: ${score}% — ${pass?'Aprovado!':'Revise o módulo e tente novamente.'}</div><div class="actions"><button class="btn" onclick="go(${state.module})">Revisar conteúdo</button>${pass&&state.module<DATA.length-1?`<button class="btn primary" onclick="go(${state.module+1})">Próximo módulo</button>`:pass?`<button class="btn primary" onclick="intro()">Concluir curso</button>`:''}</div>`;}
function render(){renderNav();state.route==='module'?renderModule():renderIntro();}
document.getElementById('theme').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';};
render();
